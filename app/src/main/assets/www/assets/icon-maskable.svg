<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Дейликард — две карточки на синем фоне">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E80E4"/>
      <stop offset="0.55" stop-color="#0B57D0"/>
      <stop offset="1" stop-color="#083FA0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04245C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="438" cy="54" r="166" fill="#9CC5FF" opacity="0.20"/>
  <circle cx="34" cy="478" r="164" fill="#001B4A" opacity="0.16"/>

  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <g transform="rotate(-14 228 288)" filter="url(#shadow)">
      <rect x="139" y="169" width="178" height="238" rx="26" fill="#FFFFFF" opacity="0.58"/>
    </g>
    <g transform="rotate(7 292 256)" filter="url(#shadow)">
      <rect x="200" y="133" width="184" height="246" rx="26" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
